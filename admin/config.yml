backend:
  name: github
  repo: siremiren/mma-website
  branch: main

media_folder: "images"

collections:
  - name: "pages"
    label: "Pages"
    files:

      - name: "home"
        label: "Home Page"
        file: "content/home.json"
        fields:
          - { label: "Hero Badge Text", name: "hero_badge", widget: "string" }
          - { label: "Hero Heading (use <em> for gold text)", name: "hero_heading", widget: "string" }
          - { label: "Hero Description", name: "hero_sub", widget: "text" }
          - { label: "Stat 1 Number", name: "stat1_num", widget: "string" }
          - { label: "Stat 1 Label", name: "stat1_label", widget: "string" }
          - { label: "Stat 2 Number", name: "stat2_num", widget: "string" }
          - { label: "Stat 2 Label", name: "stat2_label", widget: "string" }
          - { label: "Stat 3 Number", name: "stat3_num", widget: "string" }
          - { label: "Stat 3 Label", name: "stat3_label", widget: "string" }
          - { label: "Stat 4 Number", name: "stat4_num", widget: "string" }
          - { label: "Stat 4 Label", name: "stat4_label", widget: "string" }
          - { label: "Problem Section Heading", name: "problem_heading", widget: "string" }
          - { label: "Problem Paragraph 1", name: "problem_p1", widget: "text" }
          - { label: "Problem Paragraph 2", name: "problem_p2", widget: "text" }
          - { label: "Problem Paragraph 3", name: "problem_p3", widget: "text" }
          - { label: "Callout Quote", name: "callout_quote", widget: "text" }
          - { label: "Callout Attribution", name: "callout_attr", widget: "string" }
          - { label: "Method Heading", name: "method_heading", widget: "string" }
          - { label: "Method Description", name: "method_desc", widget: "text" }
          - { label: "Card 1 Title", name: "card1_title", widget: "string" }
          - { label: "Card 1 Description", name: "card1_desc", widget: "text" }
          - { label: "Card 2 Title", name: "card2_title", widget: "string" }
          - { label: "Card 2 Description", name: "card2_desc", widget: "text" }
          - { label: "Card 3 Title", name: "card3_title", widget: "string" }
          - { label: "Card 3 Description", name: "card3_desc", widget: "text" }
          - { label: "Individuals Description", name: "individuals_desc", widget: "text" }
          - { label: "Organisations Description", name: "organisations_desc", widget: "text" }
          - { label: "Impact Heading", name: "impact_heading", widget: "string" }
          - { label: "Impact Paragraph 1 (use <strong> for bold)", name: "impact_p1", widget: "text" }
          - { label: "Impact Paragraph 2", name: "impact_p2", widget: "text" }
          - { label: "Impact Paragraph 3 (use <strong> for bold)", name: "impact_p3", widget: "text" }
          - { label: "CTA Heading", name: "cta_heading", widget: "string" }
          - { label: "CTA Description", name: "cta_desc", widget: "text" }
          - { label: "Email Capture Heading", name: "capture_heading", widget: "string" }
          - { label: "Email Capture Subtext", name: "capture_subtext", widget: "string" }

      - name: "about"
        label: "About Page"
        file: "content/about.json"
        fields:
          - { label: "Page Subtitle", name: "page_desc", widget: "text" }
          - { label: "Founder Bio Paragraph 1", name: "founder_p1", widget: "text" }
          - { label: "Founder Bio Paragraph 2", name: "founder_p2", widget: "text" }
          - { label: "Founder Bio Paragraph 3", name: "founder_p3", widget: "text" }
          - { label: "Why We Exist Heading", name: "gap_heading", widget: "string" }
          - { label: "Why We Exist Paragraph 1", name: "gap_p1", widget: "text" }
          - { label: "Why We Exist Paragraph 2", name: "gap_p2", widget: "text" }
          - { label: "Why We Exist Paragraph 3", name: "gap_p3", widget: "text" }
          - { label: "Callout Quote", name: "callout_quote", widget: "text" }
          - { label: "Callout Attribution", name: "callout_attr", widget: "string" }
          - { label: "Approach Heading", name: "approach_heading", widget: "string" }
          - { label: "Approach Description", name: "approach_desc", widget: "text" }

      - name: "programmes"
        label: "Programmes Page"
        file: "content/programmes.json"
        fields:
          - { label: "Page Subtitle", name: "page_desc", widget: "text" }
          - label: "Individuals Section"
            name: "individuals_group"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Section Heading", name: "individuals_section_heading", widget: "string" }
              - { label: "Section Description", name: "individuals_section_desc", widget: "text" }
          - label: "Programme 1 — DIY Accelerator"
            name: "p1_group"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Card Title", name: "p1_title", widget: "string" }
              - { label: "Card Description", name: "p1_desc", widget: "text" }
              - { label: "What You Will Learn 1", name: "p1_learn_1", widget: "string" }
              - { label: "What You Will Learn 2", name: "p1_learn_2", widget: "string" }
              - { label: "What You Will Learn 3", name: "p1_learn_3", widget: "string" }
              - { label: "What You Will Learn 4", name: "p1_learn_4", widget: "string" }
              - { label: "What You Will Learn 5", name: "p1_learn_5", widget: "string" }
              - { label: "Who This Is For 1", name: "p1_for_1", widget: "string" }
              - { label: "Who This Is For 2", name: "p1_for_2", widget: "string" }
              - { label: "Who This Is For 3", name: "p1_for_3", widget: "string" }
              - { label: "What You Will Leave With 1", name: "p1_leave_1", widget: "string" }
              - { label: "What You Will Leave With 2", name: "p1_leave_2", widget: "string" }
              - { label: "What You Will Leave With 3", name: "p1_leave_3", widget: "string" }
              - { label: "What You Will Leave With 4", name: "p1_leave_4", widget: "string" }
              - { label: "What You Will Leave With 5", name: "p1_leave_5", widget: "string" }
          - label: "Programme 2 — Done With You"
            name: "p2_group"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Card Title", name: "p2_title", widget: "string" }
              - { label: "Card Description", name: "p2_desc", widget: "text" }
              - { label: "What This Includes 1", name: "p2_includes_1", widget: "string" }
              - { label: "What This Includes 2", name: "p2_includes_2", widget: "string" }
              - { label: "What This Includes 3", name: "p2_includes_3", widget: "string" }
              - { label: "What This Includes 4", name: "p2_includes_4", widget: "string" }
              - { label: "What This Includes 5", name: "p2_includes_5", widget: "string" }
              - { label: "Who This Is For 1", name: "p2_for_1", widget: "string" }
              - { label: "Who This Is For 2", name: "p2_for_2", widget: "string" }
              - { label: "Who This Is For 3", name: "p2_for_3", widget: "string" }
              - { label: "What You Will Leave With 1", name: "p2_leave_1", widget: "string" }
              - { label: "What You Will Leave With 2", name: "p2_leave_2", widget: "string" }
              - { label: "What You Will Leave With 3", name: "p2_leave_3", widget: "string" }
              - { label: "What You Will Leave With 4", name: "p2_leave_4", widget: "string" }
              - { label: "What You Will Leave With 5", name: "p2_leave_5", widget: "string" }
          - label: "Programme 3 — Done For You"
            name: "p3_group"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Card Title", name: "p3_title", widget: "string" }
              - { label: "Card Description", name: "dfy_desc", widget: "text" }
              - { label: "What We Do For You 1", name: "p3_does_1", widget: "string" }
              - { label: "What We Do For You 2", name: "p3_does_2", widget: "string" }
              - { label: "What We Do For You 3", name: "p3_does_3", widget: "string" }
              - { label: "What We Do For You 4", name: "p3_does_4", widget: "string" }
              - { label: "What We Do For You 5", name: "p3_does_5", widget: "string" }
              - { label: "Who This Is For 1", name: "p3_for_1", widget: "string" }
              - { label: "Who This Is For 2", name: "p3_for_2", widget: "string" }
              - { label: "Who This Is For 3", name: "p3_for_3", widget: "string" }
              - { label: "What You Will Walk Away With 1", name: "p3_leave_1", widget: "string" }
              - { label: "What You Will Walk Away With 2", name: "p3_leave_2", widget: "string" }
              - { label: "What You Will Walk Away With 3", name: "p3_leave_3", widget: "string" }
              - { label: "What You Will Walk Away With 4", name: "p3_leave_4", widget: "string" }
              - { label: "What You Will Walk Away With 5", name: "p3_leave_5", widget: "string" }
          - label: "Organisations Section"
            name: "org_group"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Section Heading", name: "organisations_heading", widget: "string" }
              - { label: "Section Description", name: "organisations_desc", widget: "text" }
              - { label: "Universities", name: "sector_universities", widget: "text" }
              - { label: "Councils & Government", name: "sector_councils", widget: "text" }
              - { label: "Charities & Third Sector", name: "sector_charities", widget: "text" }
              - { label: "Prisons & Rehabilitation", name: "sector_prisons", widget: "text" }
              - { label: "Schools & Youth", name: "sector_schools", widget: "text" }
              - { label: "Corporate Partners", name: "sector_corporate", widget: "text" }
          - label: "What Partners Can Expect"
            name: "expect_group"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Section Heading", name: "partners_section_heading", widget: "string" }
              - { label: "Point 1", name: "expect_1", widget: "string" }
              - { label: "Point 2", name: "expect_2", widget: "string" }
              - { label: "Point 3", name: "expect_3", widget: "string" }
              - { label: "Point 4", name: "expect_4", widget: "string" }
              - { label: "Point 5", name: "expect_5", widget: "string" }
              - { label: "Point 6", name: "expect_6", widget: "string" }
              - { label: "Point 7", name: "expect_7", widget: "string" }
              - { label: "Point 8", name: "expect_8", widget: "string" }
          - { label: "CTA Heading", name: "cta_section_heading", widget: "string" }
          - { label: "CTA Description", name: "cta_section_desc", widget: "text" }

      - name: "workshop"
        label: "Workshop Page"
        file: "content/workshop.json"
        fields:
          - { label: "Hero Badge Text", name: "hero_badge", widget: "string" }
          - { label: "Hero Heading (use <em> for gold text)", name: "hero_heading", widget: "string" }
          - { label: "Hero Description", name: "hero_desc", widget: "text" }
          - { label: "Next Workshop Date", name: "next_date", widget: "string" }
          - { label: "Main Heading", name: "main_heading", widget: "string" }
          - { label: "Intro Paragraph 1", name: "intro_p1", widget: "text" }
          - { label: "Intro Paragraph 2", name: "intro_p2", widget: "text" }
          - { label: "Outcomes Section Heading", name: "outcomes_heading", widget: "string" }
          - { label: "Outcome 1", name: "outcome_1", widget: "text" }
          - { label: "Outcome 2", name: "outcome_2", widget: "text" }
          - { label: "Outcome 3", name: "outcome_3", widget: "text" }
          - { label: "Outcome 4", name: "outcome_4", widget: "text" }
          - { label: "Outcome 5", name: "outcome_5", widget: "text" }
          - { label: "Who This Is For Heading", name: "who_heading", widget: "string" }
          - { label: "Who This Is For Description", name: "who_desc", widget: "text" }
          - { label: "Form Label", name: "form_label", widget: "string" }
          - { label: "Form Heading", name: "form_heading", widget: "string" }
          - { label: "Form Description", name: "form_desc", widget: "text" }
          - { label: "Social Proof Heading", name: "social_proof_heading", widget: "string" }
          - { label: "Social Proof Description", name: "social_proof_desc", widget: "text" }

      - name: "businessplan"
        label: "Business Plan Tool"
        file: "content/businessplan.json"
        fields:
          - { label: "Badge Text", name: "badge_text", widget: "string" }
          - { label: "Card Heading (use <em> for italic gold text)", name: "card_heading", widget: "string" }
          - { label: "Card Description", name: "card_desc", widget: "text" }
          - { label: "Step 1 Label", name: "step_1", widget: "string" }
          - { label: "Step 2 Label", name: "step_2", widget: "string" }
          - { label: "Step 3 Label", name: "step_3", widget: "string" }
          - { label: "Name Field Label", name: "label_name", widget: "string" }
          - { label: "Start Button Text", name: "btn_start", widget: "string" }
          - { label: "Questions Section Label", name: "questions_label", widget: "string" }
          - { label: "Questions Heading", name: "questions_heading", widget: "string" }
          - { label: "Questions Intro Text", name: "questions_intro", widget: "text" }
          - { label: "Question 1", name: "q1_text", widget: "string" }
          - { label: "Question 2", name: "q2_text", widget: "string" }
          - { label: "Question 3", name: "q3_text", widget: "string" }
          - { label: "Question 4", name: "q4_text", widget: "string" }
          - { label: "Question 5", name: "q5_text", widget: "string" }
          - { label: "Question 6", name: "q6_text", widget: "string" }
          - { label: "Question 7", name: "q7_text", widget: "string" }
          - { label: "Generate Button Text", name: "btn_generate", widget: "string" }
          - { label: "Generate Small Print", name: "generate_note", widget: "string" }
          - { label: "Output Section Label", name: "output_label", widget: "string" }
          - { label: "Output Heading", name: "output_heading", widget: "string" }
          - { label: "Output Subtext", name: "output_sub", widget: "string" }
          - { label: "Plan Document Title", name: "doc_title", widget: "string" }
          - { label: "Plan Document Subtitle", name: "doc_subtitle", widget: "text" }
          - { label: "CTA Heading", name: "cta_heading", widget: "string" }
          - { label: "CTA Description", name: "cta_desc", widget: "text" }
          - { label: "CTA Button Text", name: "cta_btn", widget: "string" }

      - name: "media"
        label: "Media Page — Testimonials"
        file: "content/media.json"
        fields:
          - { label: "Quote 1", name: "quote_1", widget: "text" }
          - { label: "Name 1", name: "name_1", widget: "string" }
          - { label: "Context 1", name: "context_1", widget: "string" }
          - { label: "Quote 2", name: "quote_2", widget: "text" }
          - { label: "Name 2", name: "name_2", widget: "string" }
          - { label: "Context 2", name: "context_2", widget: "string" }
          - { label: "Quote 3", name: "quote_3", widget: "text" }
          - { label: "Name 3", name: "name_3", widget: "string" }
          - { label: "Context 3", name: "context_3", widget: "string" }
          - { label: "Quote 4", name: "quote_4", widget: "text" }
          - { label: "Name 4", name: "name_4", widget: "string" }
          - { label: "Context 4", name: "context_4", widget: "string" }
          - { label: "Quote 5", name: "quote_5", widget: "text", required: false }
          - { label: "Name 5", name: "name_5", widget: "string", required: false }
          - { label: "Context 5", name: "context_5", widget: "string", required: false }
          - { label: "Quote 6", name: "quote_6", widget: "text", required: false }
          - { label: "Name 6", name: "name_6", widget: "string", required: false }
          - { label: "Context 6", name: "context_6", widget: "string", required: false }
          - { label: "Quote 7", name: "quote_7", widget: "text", required: false }
          - { label: "Name 7", name: "name_7", widget: "string", required: false }
          - { label: "Context 7", name: "context_7", widget: "string", required: false }
          - { label: "Quote 8", name: "quote_8", widget: "text", required: false }
          - { label: "Name 8", name: "name_8", widget: "string", required: false }
          - { label: "Context 8", name: "context_8", widget: "string", required: false }
          - { label: "Quote 9", name: "quote_9", widget: "text", required: false }
          - { label: "Name 9", name: "name_9", widget: "string", required: false }
          - { label: "Context 9", name: "context_9", widget: "string", required: false }

  - name: "images"
    label: "Site Images"
    files:
      - name: "site_images"
        label: "Upload Images"
        file: "content/images.json"
        fields:
          - { label: "Hero Image", name: "hero_img", widget: "image", required: false }
          - { label: "Founder Portrait", name: "founder_img", widget: "image", required: false }
          - { label: "Community Event Photo", name: "community_img", widget: "image", required: false }
