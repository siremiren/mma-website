backend:
  name: github
  repo: siremiren/mma-website
  branch: main

publish_mode: editorial_workflow

media_folder: "images"

# Only fields connected to public pages are exposed. Decap 3.18.0 preserves
# unknown JSON keys on save, so historical copy stays in its existing files.
collections:
  - name: "pages"
    label: "Pages"
    files:

      - name: "home"
        label: "Home Page"
        file: "content/home.json"
        fields:
          - label: "Hero heading"
            name: "hero_heading"
            widget: "string"
            hint: "Use `<em>...</em>` for the gold emphasis. Other markup displays as text."
          - { label: "Hero paragraph 1", name: "hero_sub", widget: "text" }
          - { label: "Hero paragraph 2", name: "hero_sub2", widget: "text" }

      - name: "about"
        label: "About Page"
        file: "content/about.json"
        fields:
          - { label: "Hero introduction", name: "page_desc", widget: "text" }
          - { label: "Founder biography paragraph 1", name: "founder_p1", widget: "text" }
          - { label: "Founder biography paragraph 2", name: "founder_p2", widget: "text" }
          - { label: "Founder biography paragraph 3", name: "founder_p3", widget: "text" }
          - { label: "Why We Exist Heading", name: "gap_heading", widget: "string" }
          - { label: "Why We Exist Paragraph 1", name: "gap_p1", widget: "text" }
          - { label: "Why We Exist Paragraph 2", name: "gap_p2", widget: "text" }
          - { label: "Why We Exist Paragraph 3", name: "gap_p3", widget: "text" }
          - { label: "Why We Exist quote", name: "callout_quote", widget: "text" }
          - { label: "Why We Exist quote attribution", name: "callout_attr", widget: "string" }
          - { label: "Our Approach heading", name: "approach_heading", widget: "string" }
          - { label: "Our Approach introduction", name: "approach_desc", widget: "text" }

      - name: "programmes"
        label: "Programmes Page"
        file: "content/programmes.json"
        fields:
          - { label: "Hero paragraph 1", name: "page_desc", widget: "text" }
          - { label: "Hero paragraph 2", name: "page_desc2", widget: "text" }
          - { label: "Training areas heading", name: "individuals_section_heading", widget: "string" }
          - { label: "Training areas introduction", name: "individuals_section_desc", widget: "text" }
          - { label: "Entrepreneurship card title", name: "p1_title", widget: "string" }
          - { label: "Entrepreneurship card paragraph 1", name: "p1_desc", widget: "text" }
          - { label: "Entrepreneurship card paragraph 2", name: "p1_desc2", widget: "text" }
          - { label: "Professional & Personal Development card title", name: "p2_title", widget: "string" }
          - { label: "Professional & Personal Development card description", name: "p2_desc", widget: "text" }
          - { label: "Artificial Intelligence card title", name: "p3_title", widget: "string" }
          - { label: "Artificial Intelligence card description", name: "dfy_desc", widget: "text" }
          - { label: "Organisations heading", name: "organisations_heading", widget: "string" }
          - { label: "Organisations paragraph 1", name: "organisations_desc", widget: "text" }
          - { label: "Organisations paragraph 2", name: "organisations_desc2", widget: "text" }
          - { label: "Universities", name: "sector_universities", widget: "text" }
          - { label: "Councils & Government", name: "sector_councils", widget: "text" }
          - { label: "Charities & Third Sector", name: "sector_charities", widget: "text" }
          - { label: "Prisons & Rehabilitation", name: "sector_prisons", widget: "text" }
          - { label: "Schools & Youth", name: "sector_schools", widget: "text" }
          - { label: "Businesses & Employers", name: "sector_corporate", widget: "text" }
          - { label: "Measuring success heading", name: "partners_section_heading", widget: "string" }
          - { label: "Measuring success introduction", name: "partners_section_desc", widget: "text" }
          - { label: "Measuring success examples lead-in", name: "partners_section_examples", widget: "text" }
          - { label: "Measure 01 title", name: "expect_1_title", widget: "string" }
          - { label: "Measure 01 description", name: "expect_1", widget: "text" }
          - { label: "Measure 02 title", name: "expect_2_title", widget: "string" }
          - { label: "Measure 02 description", name: "expect_2", widget: "text" }
          - { label: "Measure 03 title", name: "expect_3_title", widget: "string" }
          - { label: "Measure 03 description", name: "expect_3", widget: "text" }
          - { label: "Measure 04 title", name: "expect_4_title", widget: "string" }
          - { label: "Measure 04 description", name: "expect_4", widget: "text" }
          - { label: "Measure 05 title", name: "expect_5_title", widget: "string" }
          - { label: "Measure 05 description", name: "expect_5", widget: "text" }
          - { label: "Measure 06 title", name: "expect_6_title", widget: "string" }
          - { label: "Measure 06 description", name: "expect_6", widget: "text" }
          - { label: "Measure 07 title", name: "expect_7_title", widget: "string" }
          - { label: "Measure 07 description", name: "expect_7", widget: "text" }
          - { label: "Measure 08 title", name: "expect_8_title", widget: "string" }
